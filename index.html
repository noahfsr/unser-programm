<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah & Emma ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fff0f5,#ffe1eb);
    color:#3b2430;
    overflow-x:hidden;
}

button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}

.page{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:25px 10px 20px;
}

.header h1{
    margin:0;
    font-size:34px;
    color:#d6336c;
}

.header p{
    margin:10px 0 0;
    color:#80566a;
    font-size:17px;
}

.card{
    width:100%;
    background:rgba(255,255,255,.95);
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(120,50,80,.12);
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.menu button{
    min-height:90px;
    border:none;
    border-radius:18px;
    background:white;
    color:#4a2736;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(100,40,70,.1);
}

.back-button{
    border:none;
    background:#f3c6d5;
    color:#5d243b;
    padding:11px 17px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.identity-switch-button{
    width:100%;
    min-height:48px;
    border:none;
    border-radius:14px;
    background:#f3c6d5;
    color:#5d243b;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
}

.identity-switch-button:active{transform:scale(.98)}

.identity-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.identity-buttons button{
    border:none;
    border-radius:16px;
    background:white;
    padding:18px 30px;
    cursor:pointer;
    font-size:18px;
    box-shadow:0 5px 15px rgba(100,40,70,.12);
}

.hidden{display:none!important}

/* NACHRICHTEN */

.messages{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-height:500px;
    overflow-y:auto;
    padding:5px;
}

.message{
    width:fit-content;
    max-width:80%;
    padding:12px 15px;
    border-radius:15px;
    background:#f7dce6;
    overflow-wrap:anywhere;
}

.message.mine{
    align-self:flex-end;
    background:#ffd0df;
}

.message-name{
    font-weight:bold;
    color:#c02d62;
    font-size:14px;
}

.message-text{
    margin-top:4px;
    line-height:1.4;
}

.message-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:8px;
}

.message-time{
    color:#8d6878;
    font-size:11px;
}

.delete-message-button{
    border:none;
    border-radius:8px;
    background:white;
    color:#b52d5d;
    padding:6px 9px;
    font-size:12px;
    cursor:pointer;
}

.message-form{
    display:flex;
    gap:10px;
    width:100%;
    margin-top:15px;
}

.message-form input{
    flex:1;
    min-width:0;
    border:1px solid #edbfd0;
    border-radius:14px;
    padding:13px 15px;
    outline:none;
    background:#fffafb;
}

.send-button{
    border:none;
    border-radius:14px;
    background:#d6336c;
    color:white;
    padding:0 20px;
    cursor:pointer;
    font-weight:bold;
}

/* BILDER */

.upload-area{
    text-align:center;
    padding:20px;
    border:2px dashed #e7a9bf;
    border-radius:18px;
    background:#fff8fb;
}

.upload-label{
    display:inline-block;
    background:#d6336c;
    color:white;
    padding:13px 20px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
}

#imageInput{display:none}

.upload-status{
    margin-top:12px;
    color:#80566a;
    min-height:20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.gallery-item{
    position:relative;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    background:#f6dbe5;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
}

.delete-image-button{
    position:absolute;
    right:8px;
    top:8px;
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.92);
    color:#b52d5d;
    font-size:18px;
    cursor:pointer;
    z-index:5;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#8d6878;
    padding:35px 10px;
}

/* LIGHTBOX */

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,10,15,.9);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.lightbox.open{display:flex}

.lightbox img{
    max-width:95vw;
    max-height:85vh;
    object-fit:contain;
    border-radius:12px;
}

.close-lightbox{
    position:absolute;
    top:18px;
    right:20px;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:white;
    color:#5d243b;
    font-size:25px;
    cursor:pointer;
}

/* SPIEL */

.game-top{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.game-stat{
    background:#fff4f8;
    border:1px solid #f4d2df;
    border-radius:14px;
    padding:10px 6px;
    text-align:center;
}

.game-stat span{
    display:block;
    font-size:11px;
    color:#8d6878;
}

.game-stat strong{
    display:block;
    margin-top:3px;
    color:#d6336c;
    font-size:17px;
}

.game-board{
    position:relative;
    width:100%;
    height:520px;
    overflow:hidden;
    border-radius:22px;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.7),transparent 18%),
        radial-gradient(circle at 80% 35%,rgba(255,255,255,.45),transparent 20%),
        linear-gradient(160deg,#ffd8e7,#f5b7cf 50%,#d98eb0);
    border:3px solid rgba(255,255,255,.8);
    box-shadow:inset 0 0 40px rgba(140,50,90,.12);
    touch-action:none;
}

.game-board.sunset{
    background:
        radial-gradient(circle at 75% 18%,#fff3bb,transparent 13%),
        linear-gradient(160deg,#ffc9a9,#ee9ba9 52%,#9e7299);
}

.game-board.night{
    background:
        radial-gradient(circle at 75% 18%,#fff5b0,transparent 9%),
        radial-gradient(circle at 10% 15%,white 0 1px,transparent 2px),
        radial-gradient(circle at 25% 40%,white 0 1px,transparent 2px),
        radial-gradient(circle at 42% 18%,white 0 1px,transparent 2px),
        radial-gradient(circle at 60% 32%,white 0 1px,transparent 2px),
        radial-gradient(circle at 80% 55%,white 0 1px,transparent 2px),
        radial-gradient(circle at 35% 75%,white 0 1px,transparent 2px),
        linear-gradient(160deg,#42355f,#29244b,#17172e);
}

.game-board.magic{
    background:
        radial-gradient(circle at 20% 25%,rgba(255,255,255,.4),transparent 14%),
        radial-gradient(circle at 80% 70%,rgba(255,180,230,.5),transparent 18%),
        linear-gradient(160deg,#bda2ed,#d98ed0,#6d5ca8);
}

.player{
    position:absolute;
    width:54px;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    user-select:none;
    z-index:10;
    filter:drop-shadow(0 5px 5px rgba(80,20,50,.25));
    will-change:left;
}

.game-item{
    position:absolute;
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    user-select:none;
    z-index:5;
    pointer-events:none;
}

.game-item.special{
    font-size:36px;
    filter:drop-shadow(0 0 7px rgba(255,255,255,.8));
}

.game-message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:white;
    text-shadow:0 3px 12px rgba(70,20,50,.4);
    z-index:30;
    pointer-events:none;
}

.game-message h2{
    margin:0 0 8px;
    font-size:32px;
}

.game-message p{
    margin:0;
    font-size:16px;
}

.game-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:14px;
}

.game-controls button{
    width:70px;
    height:52px;
    border:none;
    border-radius:14px;
    background:white;
    color:#d6336c;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(100,40,70,.12);
    cursor:pointer;
    user-select:none;
    touch-action:none;
}

.game-controls button:active{
    transform:scale(.94);
    background:#fff0f5;
}

.game-button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:13px;
    background:#d6336c;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* SHOP */

.shop-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.shop-item{
    background:#fff7fa;
    border:1px solid #f1cfdd;
    border-radius:16px;
    padding:14px;
    text-align:center;
}

.shop-item .shop-icon{font-size:32px}

.shop-item h3{
    margin:7px 0 5px;
    font-size:16px;
}

.shop-item p{
    margin:0 0 9px;
    font-size:12px;
    color:#80566a;
}

.shop-item button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:9px;
    background:#d6336c;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.shop-item button:disabled{
    background:#c9a8b5;
    cursor:not-allowed;
}

/* WELTEN */

.world-list{
    display:grid;
    gap:10px;
}

.world{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px;
    border-radius:15px;
    background:#fff7fa;
    border:1px solid #f1cfdd;
}

.world-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.world-icon{font-size:30px}

.world button{
    border:none;
    border-radius:10px;
    padding:9px 12px;
    background:#d6336c;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.world.locked{opacity:.55}

/* MISSIONEN */

.mission{
    padding:12px;
    border-radius:14px;
    background:#fff7fa;
    margin-bottom:8px;
    border:1px solid #f1cfdd;
}

.mission.done{background:#f6e7ef}

.mission-title{font-weight:bold}

.mission-progress{
    font-size:12px;
    color:#80566a;
    margin-top:4px;
}

.progress-bar{
    height:8px;
    border-radius:99px;
    background:#f0d8e1;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    background:#d6336c;
    border-radius:99px;
}

/* BESTENLISTE */

.leaderboard{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.score-row{
    display:grid;
    grid-template-columns:40px 1fr auto;
    align-items:center;
    gap:8px;
    padding:11px;
    border-radius:13px;
    background:#fff7fa;
}

.score-rank{font-size:22px}
.score-name{font-weight:bold}
.score-value{
    color:#d6336c;
    font-weight:bold;
}

/* MOBIL */

@media(max-width:600px){

    .page{padding:10px}

    .header{padding:18px 5px 15px}

    .header h1{font-size:27px}

    .header p{font-size:15px}

    .card{
        padding:14px;
        border-radius:18px;
        margin-bottom:12px;
    }

    .menu{gap:9px}

    .menu button{
        min-height:75px;
        font-size:14px;
    }

    .message{max-width:94%}

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .game-board{
        height:430px;
        border-radius:18px;
    }

    .game-top{
        grid-template-columns:repeat(3,1fr);
    }

    .game-stat span{font-size:10px}
    .game-stat strong{font-size:16px}

    .shop-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:380px){

    .page{padding:8px}

    .card{padding:11px}

    .header h1{font-size:24px}

    .menu button{
        min-height:70px;
        font-size:13px;
    }

    .message-form{flex-direction:column}

    .message-form input{width:100%}

    .send-button{
        width:100%;
        min-height:44px;
    }

    .game-board{height:390px}

    .game-controls button{
        width:65px;
        height:48px;
    }

    .shop-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="page">

<section id="homePage">

<div class="header">
<h1>❤️ Noah & Emma</h1>
<p>Ein Ort für unsere schönsten Momente 💕</p>
</div>

<div class="card">

<div class="menu">

<button onclick="openMessages()">💌<br>Nachrichten</button>

<button onclick="openImages()">📸<br>Unsere Bilder</button>

<button onclick="showComingSoon('Unsere Momente')">💕<br>Unsere Momente</button>

<button onclick="showComingSoon('Unser Spiel')">🎮<br>Unser Spiel</button>

<button onclick="showComingSoon('Überraschung')">✨<br>Überraschung</button>

<button onclick="showComingSoon('Unsere Wünsche')">📝<br>Unsere Wünsche</button>

</div>

</div>

<div class="card" style="text-align:center">

<span id="currentUserText"></span>

<br><br>

<button class="identity-switch-button" onclick="changeIdentity()">
👤 Person wechseln
</button>

</div>

</section>


<section id="identityPage" class="hidden">

<div class="header">
<h1>❤️ Hallo!</h1>
<p>Wer bist du?</p>
</div>

<div class="card">

<div class="identity-buttons">

<button onclick="chooseIdentity('Noah')">👦<br>Noah</button>

<button onclick="chooseIdentity('Emma')">👧<br>Emma</button>

</div>

<div style="text-align:center;margin-top:16px">

<button class="back-button" onclick="showPage('homePage')">
← Zurück
</button>

</div>

</div>

</section>


<section id="messagesPage" class="hidden">

<button class="back-button" onclick="goHome()">← Zurück</button>

<div class="header">
<h1>💌 Nachrichten</h1>
<p>Nur für uns beide ❤️</p>
</div>

<div class="card">

<div id="messages" class="messages">

<div class="empty">Nachrichten werden geladen...</div>

</div>

<form id="messageForm" class="message-form">

<input
id="messageInput"
type="text"
maxlength="1000"
placeholder="Schreib etwas... ❤️"
autocomplete="off">

<button class="send-button" type="submit">Senden</button>

</form>

</div>

</section>


<section id="imagesPage" class="hidden">

<button class="back-button" onclick="goHome()">← Zurück</button>

<div class="header">
<h1>📸 Unsere Bilder</h1>
<p>Unsere schönsten Erinnerungen ❤️</p>
</div>

<div class="card">

<div class="upload-area">

<label class="upload-label" for="imageInput">
📷 Bild auswählen
</label>

<input id="imageInput" type="file" accept="image/*" multiple>

<div id="uploadStatus" class="upload-status"></div>

</div>

<div id="gallery" class="gallery">

<div class="empty">Bilder werden geladen...</div>

</div>

</div>

</section>


<section id="soonPage" class="hidden">

<button class="back-button" onclick="goHome()">← Zurück</button>

<div class="card" style="text-align:center;padding:30px">

<div style="font-size:50px">✨</div>

<h2 id="soonTitle">Bald verfügbar</h2>

<p>Dieser Bereich kommt noch. ❤️</p>

</div>

</section>

</div>


<div id="lightbox" class="lightbox">

<button id="closeLightbox" class="close-lightbox">×</button>

<img id="lightboxImage" src="" alt="Großes Bild">

</div>


<script>

const SUPABASE_URL=
"https://mvlhbxtywabqsnfcfrzm.supabase.co";

const SUPABASE_KEY=
"sb_publishable_VWpohfk0SvSuK6eum-FZMQ_sbp-nPJy";

const supabaseClient=
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const MESSAGE_TABLE="message";
const IMAGE_BUCKET="bilder";


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* PERSON */

let currentUser=
localStorage.getItem(
    "unser_programm_user"
);

function chooseIdentity(name){

    currentUser=name;

    localStorage.setItem(
        "unser_programm_user",
        name
    );

    updateUserText();

    showPage("homePage");
}

function changeIdentity(){

    stopGame();

    showPage("identityPage");
}

function updateUserText(){

    const element=
        document.getElementById(
            "currentUserText"
        );

    if(!element)return;

    if(!currentUser){

        element.textContent="";

        return;
    }

    element.innerHTML=
        "Du bist gerade als <strong>"+
        escapeHtml(currentUser)+
        "</strong> angemeldet ❤️";
}


/* SEITEN */

function showPage(id){

    const pages=[
        "homePage",
        "identityPage",
        "messagesPage",
        "imagesPage",
        "soonPage"
    ];

    pages.forEach(pageId=>{

        const page=
            document.getElementById(pageId);

        if(page){

            page.classList.toggle(
                "hidden",
                pageId!==id
            );
        }
    });

    window.scrollTo(0,0);
}

function goHome(){

    stopGame();

    showPage("homePage");
}

function showComingSoon(name){

    document.getElementById(
        "soonTitle"
    ).textContent=name;

    showPage("soonPage");
}


/* NACHRICHTEN */

function openMessages(){

    if(!currentUser){

        showPage("identityPage");

        return;
    }

    showPage("messagesPage");

    loadMessages();
}

async function loadMessages(){

    const container=
        document.getElementById("messages");

    container.innerHTML=
        '<div class="empty">Nachrichten werden geladen...</div>';

    const result=
        await supabaseClient
        .from(MESSAGE_TABLE)
        .select("*")
        .order(
            "created_at",
            {ascending:true}
        );

    if(result.error){

        container.innerHTML=
            '<div class="empty">Fehler beim Laden der Nachrichten.</div>';

        return;
    }

    if(
        !result.data||
        result.data.length===0
    ){

        container.innerHTML=
            '<div class="empty">Noch keine Nachrichten ❤️</div>';

        return;
    }

    container.innerHTML="";

    result.data.forEach(addMessage);
}

function addMessage(message){

    const container=
        document.getElementById("messages");

    if(!container)return;

    const div=
        document.createElement("div");

    div.className="message";
    div.dataset.id=message.id;

    if(message.sender===currentUser){
        div.classList.add("mine");
    }

    const date=
        new Date(message.created_at);

    const time=
        date.toLocaleString(
            "de-DE",
            {
                day:"2-digit",
                month:"2-digit",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    div.innerHTML=
        '<div class="message-name">'+
        escapeHtml(message.sender)+
        '</div>'+
        '<div class="message-text">'+
        escapeHtml(message.message)+
        '</div>'+
        '<div class="message-footer">'+
        '<div class="message-time">'+
        time+
        '</div>'+
        '<button class="delete-message-button" type="button">🗑️ Löschen</button>'+
        '</div>';

    div.querySelector(
        ".delete-message-button"
    ).addEventListener(
        "click",
        ()=>{
            deleteMessage(
                message.id,
                div
            );
        }
    );

    container.appendChild(div);

    container.scrollTop=
        container.scrollHeight;
}

async function deleteMessage(id,element){

    if(
        !confirm(
            "Möchtest du diese Nachricht wirklich löschen?"
        )
    ){
        return;
    }

    const result=
        await supabaseClient
        .from(MESSAGE_TABLE)
        .delete()
        .eq("id",id);

    if(result.error){

        alert(
            "Die Nachricht konnte nicht gelöscht werden."
        );

        return;
    }

    if(element){
        element.remove();
    }
}

async function sendMessage(event){

    event.preventDefault();

    if(!currentUser)return;

    const input=
        document.getElementById(
            "messageInput"
        );

    const text=
        input.value.trim();

    if(!text)return;

    input.disabled=true;

    const result=
        await supabaseClient
        .from(MESSAGE_TABLE)
        .insert([
            {
                sender:currentUser,
                message:text
            }
        ])
        .select()
        .single();

async function loadImages(){

    const gallery=
        document.getElementById(
            "gallery"
        );

    gallery.innerHTML=
        '<div class="empty">Bilder werden geladen...</div>';

    const result=
        await supabaseClient
        .storage
        .from(IMAGE_BUCKET)
        .list(
            "",
            {
                limit:100,
                offset:0,
                sortBy:{
                    column:"created_at",
                    order:"desc"
                }
            }
        );

    if(result.error){

        gallery.innerHTML=
            '<div class="empty">Fehler beim Laden der Bilder.</div>';

        return;
    }

    const files=
        (result.data||[])
        .filter(
            file=>
                file.name&&
                file.name!==".emptyFolderPlaceholder"
        );

    if(files.length===0){

        gallery.innerHTML=
            '<div class="empty">Noch keine Bilder ❤️<br>Lade euer erstes Bild hoch!</div>';

        return;
    }

    gallery.innerHTML="";

    for(const file of files){

        const signedResult=
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .createSignedUrl(
                file.name,
                3600
            );

        if(signedResult.error)continue;

        const url=
            signedResult.data.signedUrl;

        const item=
            document.createElement("div");

        item.className="gallery-item";

        const image=
            document.createElement("img");

        image.src=url;
        image.alt="Unser Bild";
        image.loading="lazy";

        image.addEventListener(
            "click",
            ()=>openLightbox(url)
        );

        const deleteButton=
            document.createElement("button");

        deleteButton.type="button";
        deleteButton.className="delete-image-button";
        deleteButton.textContent="🗑️";

        deleteButton.addEventListener(
            "click",
            event=>{

                event.stopPropagation();

                deleteImage(
                    file.name,
                    item
                );
            }
        );

        item.appendChild(image);
        item.appendChild(deleteButton);

        gallery.appendChild(item);
    }
}

async function deleteImage(fileName,element){

    if(
        !confirm(
            "Möchtest du dieses Bild wirklich löschen?"
        )
    ){
        return;
    }

    const result=
        await supabaseClient
        .storage
        .from(IMAGE_BUCKET)
        .remove([fileName]);

    if(result.error){

        alert(
            "Das Bild konnte nicht gelöscht werden."
        );

        return;
    }

    if(element){
        element.remove();
    }
}

async function uploadImages(event){

    const files=
        Array.from(
            event.target.files||[]
        );

    if(!files.length)return;

    const status=
        document.getElementById(
            "uploadStatus"
        );

    status.textContent=
        "Bilder werden hochgeladen...";

    let count=0;

    for(const file of files){

        if(
            !file.type.startsWith("image/")
        ){
            continue;
        }

        const extension=
            getExtension(file.name)||"jpg";

        const fileName=
            Date.now()+
            "-"+
            Math.random()
                .toString(36)
                .substring(2,10)+
            "."+
            extension;

        const result=
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .upload(
                fileName,
                file,
                {
                    contentType:file.type,
                    upsert:false
                }
            );

        if(!result.error){
            count++;
        }
    }

    event.target.value="";

    status.textContent=
        count===1
        ?"1 Bild wurde hochgeladen ❤️"
        :count+" Bilder wurden hochgeladen ❤️";

    await loadImages();

    setTimeout(
        ()=>{
            status.textContent="";
        },
        3000
    );
}

function getExtension(name){

    const parts=
        name.split(".");

    if(parts.length<2)return "";

    return parts
        .pop()
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );
}

    magnet:100,
    time:150,
    double:200,
    shield:175
};

const POWERUP_GROWTH=1.10;

let gameData={
    coins:0,
    totalScore:0,
    world:"garden",

    unlocked:{
        garden:true,
        sunset:false,
        night:false,

        double:0,
        shield:0
    },

        hearts:0,

        stars:0
    }
};

let roundScore=0;
let gameTime=60;

/* POWER-UP PREIS */

function getPowerupPrice(type){

    const base=
        POWERUP_BASE_PRICES[type];

    if(base===undefined){
        return Infinity;
    }

    const level=
        Math.max(
            0,
            Math.min(
                MAX_POWERUP_LEVEL,
                Number(gameData.powerups[type])||0
            )
        );

    return Math.floor(
        base*
        Math.pow(
            POWERUP_GROWTH,
            level
        )
    );
}

function updateShopButtons(){

    const types=[
        "magnet",
        "time",
        "double",
        "shield"
    ];

    types.forEach(type=>{

        const button=
            document.getElementById(
                type+"BuyButton"
            );

        if(!button)return;

        const level=
            Math.max(
                0,
                Math.min(
                    MAX_POWERUP_LEVEL,
                    Number(gameData.powerups[type])||0
                )
            );

        if(level>=MAX_POWERUP_LEVEL){

            button.textContent=
                "MAX. 10/10";

            button.disabled=true;

            return;
        }

        const price=
            getPowerupPrice(type);

        button.textContent=
            price+
            " 💕";

        button.disabled=
            gameData.coins<
            price;
    });
}


/* SPEICHERN */

function loadGameData(){

    try{

        const saved=
            JSON.parse(
                localStorage.getItem(
                    GAME_KEY
                )
            );

        if(saved){

            gameData={
                ...gameData,
                ...saved,

                unlocked:{
                    ...gameData.unlocked,
                    ...(saved.unlocked||{})
                },

                powerups:{
                    ...gameData.powerups,
                    ...(saved.powerups||{})
                },

                missions:{
                    ...gameData.missions,
                    ...(saved.missions||{})
                }
            };

            if(
                (
                    !gameData.totalScore||
                    gameData.totalScore===0
                )&&
                saved.bestScore
            ){

                gameData.totalScore=
                    saved.bestScore;
            }

            /* Alte/ungültige Power-up-Werte begrenzen */

            Object.keys(
                POWERUP_BASE_PRICES
            ).forEach(type=>{

                gameData.powerups[type]=
                    Math.max(
                        0,
                        Math.min(
                            MAX_POWERUP_LEVEL,
                            Number(
                                gameData.powerups[type]
                            )||0
                        )
                    );
            });
        }

    }catch(error){

        console.error(error);
    }
}

function saveGameData(){

    localStorage.setItem(
        GAME_KEY,
        JSON.stringify(gameData)
    );
}

/* STOP */

function stopGame(){

    gameRunning=false;

    if(gameTimer){
        clearInterval(gameTimer);
        gameTimer=null;
    }

    if(spawnTimer){
        clearInterval(spawnTimer);
        spawnTimer=null;
    }

    if(firstSpawnTimeout){
        clearTimeout(firstSpawnTimeout);
        firstSpawnTimeout=null;
    }

    if(animationFrame){
        cancelAnimationFrame(animationFrame);
        animationFrame=null;
    }

    playerVelocity=0;
    playerTargetDirection=0;

    clearGameItems();
}


/* SPIEL START */

function startGame(){

    if(gameRunning)return;

    stopGame();

    gameRunning=true;

    roundScore=0;

    playerX=50;
    playerVelocity=0;
    playerTargetDirection=0;

    lastFrameTime=
        performance.now();

    gameTime=
        60+
        (
            gameData.powerups.time>0
            ?10
            :0
        );

    if(gameData.powerups.time>0){
        gameData.powerups.time--;
    }

    doublePointsUntil=0;

    magnetUntil=
        gameData.powerups.magnet>0
        ?Date.now()+15000
        :0;

        gameData.powerups.magnet--;
    }

    shieldActive=
        gameData.powerups.shield>0;

    if(shieldActive){
        gameData.powerups.shield--;
    }

    clearGameItems();

    placePlayer();

    hideGameMessage();

    document.getElementById(
        "startGameButton"
    ).textContent=
        "🏃 Spiel läuft...";

    updateGameUI();
    updateShopButtons();

    gameTimer=
        setInterval(
            ()=>{
                if(!gameRunning)return;

                gameTime--;

                updateGameUI();

                if(gameTime<=0){
                    endGame();
                }
            },
            1000
        );

    spawnTimer=
        setInterval(
            spawnGameItem,
            1400
        );

    firstSpawnTimeout=
        setTimeout(
            spawnGameItem,
            400
        );

    animationFrame=

        );

/* GAME LOOP */

function gameLoop(timestamp){

    if(!gameRunning)return;

    const delta=
        Math.min(
            0.032,
            Math.max(
                0.001,
                (
                    timestamp-
                    lastFrameTime
                )/1000
            )
        );

    lastFrameTime=timestamp;

    updateSmoothPlayer(delta);
    moveGameItems(delta);
    checkCollisions();

    animationFrame=
        requestAnimationFrame(
            gameLoop
        );
}


/* SPIELER */

function updateSmoothPlayer(delta){

    const maxSpeed=110;
    const acceleration=380;
    const friction=420;

    const target=
        playerTargetDirection*
        maxSpeed;

    if(playerTargetDirection!==0){

        if(playerVelocity<target){

            playerVelocity=
                Math.min(
                    target,
                    playerVelocity+
                    acceleration*delta
                );
        }

        if(playerVelocity>target){

            playerVelocity=
                Math.max(
                    target,
                    playerVelocity-
                    acceleration*delta
                );
        }

    }else{

        if(playerVelocity>0){

            playerVelocity=
                Math.max(
                    0,
                    playerVelocity-
                    friction*delta
                );

        }else if(playerVelocity<0){

            playerVelocity=
                Math.min(
                    0,
                    playerVelocity+
                    friction*delta
                );
        }
    }

    playerX+=
        playerVelocity*
        delta/
        5;

    playerX=
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );

    if(
        (
            playerX<=5&&
            playerVelocity<0
        )||
        (
            playerX>=95&&
            playerVelocity>0
        )
    ){

        playerVelocity=0;
    }

    placePlayer();
}


/* ITEMS BEWEGEN */

function moveGameItems(delta){

    for(
        let i=gameItems.length-1;
        i>=0;
        i--
    ){

        const item=
            gameItems[i];

        item.y+=
            item.speed*
            delta*
            60;

        if(
            magnetUntil>0&&
            Date.now()<magnetUntil
        ){

            const dx=
                playerX-item.x;

            const dy=
                playerY-item.y;

            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );

            if(distance<35){

                item.x+=dx*0.06;
                item.y+=dy*0.06;
            }
        }

        item.element.style.left=
            item.x+"%";

        item.element.style.top=
            item.y+"%";

        if(item.y>108){

            item.element.remove();

            gameItems.splice(i,1);
        }
    }
}


/* KOLLISION */

function checkCollisions(){

    for(
        let i=gameItems.length-1;
        i>=0;
        i--
    ){

        const item=
            gameItems[i];

        const dx=
            Math.abs(
                playerX-item.x
            );

        const dy=
            Math.abs(
                playerY-item.y
            );

        if(
            dx<7&&
            dy<7
        ){

            collectItem(item);

            item.element.remove();

            gameItems.splice(i,1);
        }
    }
}


/* SAMMELN */

function collectItem(item){

    if(item.type==="bad"){

        if(shieldActive){

            shieldActive=false;

            showFloatingText("🛡️ Schutz!");

            return;
        }

        showFloatingText("💔");

        return;
    }

    let value=
        item.value;

    if(
        Date.now()<
        doublePointsUntil
    ){

        value*=2;
    }

    roundScore+=value;

    if(item.type==="heart"){
        gameData.missions.hearts++;
    }

    if(item.type==="big"){
        gameData.missions.big++;
    }

    if(item.type==="star"){
        gameData.missions.stars++;
    }

    showFloatingText(
        "+"+value
    );

    saveGameData();

    updateGameUI();

    renderMissions();

    checkWorldUnlocks();
}

                    opacity;

                if(opacity<=0){

                    floating.remove();
                }

            },
            30
        );

/* SHOP */

function buyPowerup(type){

    if(
        !POWERUP_BASE_PRICES.hasOwnProperty(type)
    ){
        return;
    }

    const currentLevel=
        Math.max(
            0,
            Math.min(
                MAX_POWERUP_LEVEL,
                Number(gameData.powerups[type])||0
            )
        );

    if(currentLevel>=MAX_POWERUP_LEVEL){

        alert(
            "Dieses Power-up ist bereits auf MAX. 10/10 ❤️"
        );

        updateShopButtons();

        return;
    }

    const price=
        getPowerupPrice(type);

    if(
        gameData.coins<
        price
    ){

        alert(
            "Du brauchst noch mehr Love Coins 💕"
        );

        return;
    }

    gameData.coins-=price;

    gameData.powerups[type]=
        currentLevel+1;

    saveGameData();

    updateGameUI();

    updateShopButtons();

    alert(
        "Power-up gekauft! ❤️\n"+
        "Stufe "+
        gameData.powerups[type]+
        "/10"
    );
}


/* WELTEN */

function checkWorldUnlocks(){

    if(gameData.totalScore>=500){
        gameData.unlocked.sunset=true;
    }

    if(gameData.totalScore>=1500){
        gameData.unlocked.night=true;
    }

    if(gameData.totalScore>=3000){
        gameData.unlocked.magic=true;
    }

    saveGameData();
}

function updateWorlds(){

    const worlds=[
        ["worldSunset","sunset"],
        ["worldNight","night"],
        ["worldMagic","magic"]
    ];

    worlds.forEach(
        ([id,world])=>{

            const element=
                document.getElementById(id);

            if(!element)return;

            if(gameData.unlocked[world]){

                element.classList.remove("locked");

                const button=
                    element.querySelector("button");

                if(button){

                    button.textContent=
                        gameData.world===world
                        ?"Aktiv"
                        :"Auswählen";
                }

            }else{

                element.classList.add("locked");
            }
        }
    );

    applyWorld();
}

function selectWorld(world){

    if(!gameData.unlocked[world]){

        alert(
            "Diese Welt ist noch gesperrt ❤️"
        );

        return;
    }

    gameData.world=world;

    saveGameData();

    updateWorlds();
}

function applyWorld(){

    const board=
        document.getElementById(
            "gameBoard"
        );

    if(!board)return;

    board.classList.remove(
        "sunset",
        "night",
        "magic"
    );

    if(gameData.world==="sunset"){
        board.classList.add("sunset");
    }

    if(gameData.world==="night"){
        board.classList.add("night");
    }

    if(gameData.world==="magic"){
        board.classList.add("magic");
    }
}

    const missions=[
        {

        },
        {
            title:"💖 Sammle 10 große Herzen",
            current:gameData.missions.big,
            target:10
        },
        {
            title:"✨ Sammle 5 Sterne",
            current:gameData.missions.stars,
            target:5
        }
    ];

    container.innerHTML="";

    missions.forEach(
        mission=>{

            const done=
                mission.current>=
                mission.target;

            const current=
                Math.min(
                    mission.current,
                    mission.target
                );

            const percentage=
                current/
                mission.target*
                100;

            const div=
                document.createElement("div");

            div.className=
                "mission"+
                (
                    done
                    ?" done"
                    :""
                );

            div.innerHTML=
                '<div class="mission-title">'+
                escapeHtml(mission.title)+
                (
                    done
                    ?" ✅"
                    :""
                )+
                '</div>'+
                '<div class="mission-progress">'+
                current+
                " / "+
                mission.target+
                '</div>'+
                '<div class="progress-bar">'+
                '<div class="progress-fill" style="width:'+
                percentage+
                '%"></div>'+
                '</div>';

            container.appendChild(div);
        }
    );
}


/* BESTENLISTE */

function getLeaderboard(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "noah_emma_leaderboard"
            )
        )||[];

    }catch{

        return [];
    }
}

function saveLeaderboard(list){

    localStorage.setItem(
        "noah_emma_leaderboard",
        JSON.stringify(list)
    );
}

function addLeaderboardScore(name,score){

    if(score<=0)return;

    const list=
        getLeaderboard();

    list.push({
        name:name,
        score:score,
        date:Date.now()
    });

    list.sort(
        (a,b)=>
            b.score-a.score
    );

    saveLeaderboard(
        list.slice(0,10)
    );
}

function renderLeaderboard(){

    const container=
        document.getElementById(
            "leaderboard"
        );

    if(!container)return;

    const list=
        getLeaderboard();

    if(list.length===0){

        container.innerHTML=
            '<div class="empty">'+
            'Noch keine Scores ❤️<br>'+
            'Spielt eure erste Runde!'+
            '</div>';

        return;
    }

    const medals=[
        "🥇",
        "🥈",
        "🥉"
    ];

    container.innerHTML="";

    list.forEach(
        (entry,index)=>{

            const row=
                document.createElement("div");

            row.className="score-row";

            const medal=
                medals[index]||
                (index+1)+".";

            row.innerHTML=
                '<div class="score-rank">'+
                medal+
                '</div>'+
                '<div class="score-name">'+
                escapeHtml(entry.name)+
                '</div>'+
                '<div class="score-value">'+
                entry.score+
                ' ❤️</div>';

            container.appendChild(row);
        }
    );
}

);

/* TOUCH */

function setupControl(buttonId,direction){

    const button=
        document.getElementById(
            buttonId
        );

    if(!button)return;

    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            if(!gameRunning)return;

            button.setPointerCapture?.(
                event.pointerId
            );

            movePlayer(direction);
        }
    );

    const release=
        event=>{

            event.preventDefault();

            stopPlayerMovement();
        };

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        event=>{

            if(event.buttons===0){
                stopPlayerMovement();
            }
        }
    );
}
