<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsere Nachrichten</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #17171c;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: #222229;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 6px 0;
      border: 0;
      border-radius: 12px;
      background: #303039;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: #ff5c8a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      background: #2b2b34;
      padding: 14px;
      border-radius: 14px;
      margin-top: 10px;
    }

    .sender {
      color: #ff87a9;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .date {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>💌 Unsere Nachrichten</h1>

  <div class="box">

    <input
      id="sender"
      type="text"
      placeholder="Dein Name"
    >

    <input
      id="message"
      type="text"
      placeholder="Deine Nachricht"
    >

    <button onclick="sendMessage()">
      Nachricht senden
    </button>

    <div id="status"></div>

  </div>

  <div class="box">

    <h2>Nachrichten</h2>

    <div id="messages">
      Nachrichten werden geladen...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://mvlhbxtywabqsnfcfrzm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VWpohfk0SvSuK6eum-FZMQ_sbp-nPJy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadMessages() {

  const container =
    document.getElementById("messages");

  const { data, error } =
    await supabaseClient
      .from("message")
      .select("*")
      .order("created_at", {
        ascending: true
      });

  if (error) {

    console.error(error);

    container.innerHTML =
      "❌ Fehler beim Laden: " +
      escapeHTML(error.message);

    return;
  }


  container.innerHTML = "";


  if (!data || data.length === 0) {

    container.innerHTML =
      "<div style='color:#999'>Noch keine Nachrichten.</div>";

    return;
  }


  data.forEach(msg => {

    const div =
      document.createElement("div");

    div.className = "message";


    div.innerHTML = `

      <div class="sender">
        ${escapeHTML(msg.sender)}
      </div>

      <div>
        ${escapeHTML(msg.message)}
      </div>

      <div class="date">
        ${new Date(msg.created_at)
          .toLocaleString("de-DE")}
      </div>

    `;


    container.appendChild(div);

  });

}


async function sendMessage() {

  const sender =
    document
      .getElementById("sender")
      .value
      .trim();


  const message =
    document
      .getElementById("message")
      .value
      .trim();


  const status =
    document.getElementById("status");


  if (!sender) {

    status.textContent =
      "Bitte deinen Namen eingeben.";

    return;

  }


  if (!message) {

    status.textContent =
      "Bitte eine Nachricht eingeben.";

    return;

  }


  status.textContent =
    "⏳ Nachricht wird gesendet...";


  const { error } =
    await supabaseClient
      .from("message")
      .insert({

        sender: sender,

        message: message

      });


  if (error) {

    console.error(error);

    status.textContent =
      "❌ Fehler: " +
      error.message;

    return;

  }


  document
    .getElementById("message")
    .value = "";


  status.textContent =
    "✅ Nachricht gesendet!";


  await loadMessages();

}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    String(text ?? "");

  return div.innerHTML;

}


/* Nachrichten beim Start laden */

loadMessages();


/* Neue Nachrichten automatisch erkennen */

supabaseClient
  .channel("messages-channel")

  .on(
    "postgres_changes",

    {
      event: "INSERT",

      schema: "public",

      table: "message"
    },

    function() {

      loadMessages();

    }

  )

  .subscribe();


</script>

</body>
</html>
