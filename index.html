<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsere Nachrichten</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #17171c;
      color: white;
      font-family: Arial, sans-serif;

      margin-bottom: 25px;

      background: #222229;

      border-radius: 18px;
      margin-bottom: 20px;
    }

    .identity-screen {
      text-align: center;
      margin-top: 80px;

<body>

<div class="app">

  <!-- IDENTITÄT AUSWÄHLEN -->

  <div id="identityScreen" class="identity-screen">

    <h1>💕 Wer bist du?</h1>

    <p>
      Wähle deinen Namen aus.
    </p>

    <button
      class="identity-button"
      onclick="chooseIdentity('Noah')"
    >
      👦 Noah
    </button>

    <button
      class="identity-button"
      onclick="chooseIdentity('Emma')"
    >
      👧 Emma
    </button>

  </div>


  <!-- HAUPTSEITE -->

  <div id="mainApp" class="hidden">

    <div class="top-bar">

      <h1>💌 Nachrichten</h1>

      <button
        class="change-button"
        onclick="changeIdentity()"
      >
        Identität ändern
      </button>

    </div>


    <div class="current-user">
      Du bist <strong id="currentUser"></strong>
    </div>


    <div class="box">

      <input
        id="message"
        type="text"
        placeholder="Deine Nachricht..."
        maxlength="500"
        onkeydown="handleEnter(event)"
      >

      <button
        class="send-button"
        onclick="sendMessage()"
      >
        Nachricht senden
      </button>

      <div id="status"></div>

    </div>


    <div class="box">

      <h2>💬 Unsere Nachrichten</h2>

      <div id="messages">
        Nachrichten werden geladen...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://mvlhbxtywabqsnfcfrzm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VWpohfk0SvSuK6eum-FZMQ_sbp-nPJy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser =
  localStorage.getItem("unser_programm_user");


/*
   IDENTITÄT AUSWÄHLEN
*/

function chooseIdentity(name) {

  currentUser = name;

  localStorage.setItem(
    "unser_programm_user",
    name
  );

  showMainApp();

}


/*
   HAUPTSEITE ANZEIGEN
*/

function showMainApp() {

  document
    .getElementById("identityScreen")
    .classList.add("hidden");

  document
    .getElementById("mainApp")
    .classList.remove("hidden");

  document
    .getElementById("currentUser")
    .textContent = currentUser;

  loadMessages();

}


/*
   IDENTITÄT ÄNDERN
*/

function changeIdentity() {

  localStorage.removeItem(
    "unser_programm_user"
  );

  currentUser = null;

  document
    .getElementById("mainApp")
    .classList.add("hidden");

  document
    .getElementById("identityScreen")
    .classList.remove("hidden");

}


/*
   NACHRICHTEN LADEN
*/

async function loadMessages() {

  const container =
    document.getElementById("messages");


  const { data, error } =
    await supabaseClient
      .from("message")
      .select("*")
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(error);

    container.innerHTML =
      "❌ Fehler beim Laden: " +
      escapeHTML(error.message);

    return;

  }


  container.innerHTML = "";


  if (!data || data.length === 0) {

    container.innerHTML =
      "<div style='color:#999'>Noch keine Nachrichten.</div>";

    return;

  }


  data.forEach(msg => {

    const div =
      document.createElement("div");

    div.className = "message";


    div.innerHTML = `

      <div class="sender">
        ${escapeHTML(msg.sender)}
      </div>

      <div>
        ${escapeHTML(msg.message)}
      </div>

      <div class="date">
        ${new Date(msg.created_at)
          .toLocaleString("de-DE")}
      </div>

    `;


    container.appendChild(div);

  });


  /*
     Automatisch nach unten scrollen,
     damit die neuesten Nachrichten sichtbar sind.
  */

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/*
   NACHRICHT SENDEN
*/

async function sendMessage() {

  const messageInput =
    document.getElementById("message");

  const status =
    document.getElementById("status");


  const message =
    messageInput.value.trim();


  if (!currentUser) {

    status.textContent =
      "Bitte zuerst deine Identität auswählen.";

    return;

  }


  if (!message) {

    status.textContent =
      "Bitte eine Nachricht eingeben.";

    return;

  }


  status.textContent =
    "⏳ Nachricht wird gesendet...";


  const { error } =
    await supabaseClient
      .from("message")
      .insert({

        sender: currentUser,

        message: message

      });


  if (error) {

    console.error(error);

    status.textContent =
      "❌ Fehler: " +
      error.message;

    return;

  }


  messageInput.value = "";

  status.textContent =
    "✅ Nachricht gesendet!";


  await loadMessages();


  /*
     Status nach kurzer Zeit löschen
  */

  setTimeout(() => {

    status.textContent = "";

  }, 2000);

}


/*
   ENTER-TASTE
*/

function handleEnter(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }

}


/*
   HTML-SICHERHEIT
*/

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    String(text ?? "");

  return div.innerHTML;

}


/*
   AUTOMATISCHE AKTUALISIERUNG
*/

supabaseClient
  .channel("messages-channel")

  .on(
    "postgres_changes",

    {
      event: "INSERT",
      schema: "public",
      table: "message"
    },

    function() {

      /*
         Nur aktualisieren,
         wenn bereits eine Identität ausgewählt wurde.
      */

      if (currentUser) {

        loadMessages();

      }

    }

  )

  .subscribe();


/*
   BEIM START PRÜFEN,
   OB SCHON EIN NAME GESPEICHERT IST
*/

if (currentUser) {

  showMainApp();

}

</script>

</body>
</html>
